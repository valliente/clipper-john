name: Release AutoClipper Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg & yt-dlp
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "ffmpeg.exe"
          Copy-Item -Path "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "ffprobe.exe"

      - name: Build with PyInstaller
        run: |
          pyinstaller build_spec.spec
          Copy-Item "ffmpeg.exe" -Destination "dist\AutoClipper\"
          Copy-Item "ffprobe.exe" -Destination "dist\AutoClipper\"
          Copy-Item "yt-dlp.exe" -Destination "dist\AutoClipper\"

      - name: Archive build
        run: |
          Compress-Archive -Path dist\AutoClipper\* -DestinationPath AutoClipper-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: AutoClipper-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
