name: Build and Release The Clipper John 0.1.201

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Static Binaries
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src/utils/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "src/utils/ffmpeg.exe"

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller build_spec.spec

      - name: Create Zip Archive
        shell: powershell
        run: |
          Compress-Archive -Path "dist/TheClipperJohn/*" -DestinationPath "TheClipperJohn-Windows-0.1.201.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "The Clipper John 0.1.201"
          prerelease: false
          files: TheClipperJohn-Windows-0.1.201.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
